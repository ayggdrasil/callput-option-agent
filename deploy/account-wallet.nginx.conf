# Include in BOTH robin.callput.app and giwa.callput.app TLS server blocks.
# Keeps the wallet page's origin equal to the relay SIWE domain. Deploy the
# matching MCP release and persistent store first. No secrets in these routes.
location = /mcp-wallet.html {
    proxy_pass https://mcp.callput.app/frontend-v1/wallet.html;
    proxy_ssl_server_name on;
    proxy_set_header Host mcp.callput.app;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
}
location ^~ /mcp-wallet-assets/ {
    proxy_pass https://mcp.callput.app/frontend-v1/;
    proxy_ssl_server_name on;
    proxy_set_header Host mcp.callput.app;
    add_header X-Content-Type-Options nosniff always;
}
